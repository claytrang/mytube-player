<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MinimalTube Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SortableJS สำหรับลากสลับลำดับเพลง (Drag & Drop) -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap');
    body { font-family: 'Inter', 'Noto Sans Thai', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #27272a;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: #10b981;
      margin-top: -4px;
      transition: transform 0.15s ease;
    }
    input[type="range"]:hover::-webkit-slider-thumb {
      transform: scale(1.25);
      background: #34d399;
    }
    .sortable-ghost {
      opacity: 0.3;
      background: #10b98120 !important;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen flex flex-col overflow-hidden select-none">

  <!-- หน้าจอล็อกรหัสผ่านก่อนเข้าใช้งาน (Password Gate) -->
  <div id="login-modal" class="fixed inset-0 z-50 bg-zinc-950 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl space-y-5">
      <div class="flex flex-col items-center text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h1 class="text-lg font-semibold text-zinc-100">MinimalTube Private</h1>
        <p class="text-xs text-zinc-400">กรุณาใส่รหัสผ่านเพื่อเข้าใช้งานระบบ</p>
      </div>
      <div class="space-y-3">
        <input id="password-input" type="password" placeholder="รหัสผ่าน..." 
          onkeydown="if(event.key==='Enter') verifyPassword()"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-center tracking-widest text-zinc-100 focus:outline-none focus:border-emerald-500 transition">
        <p id="login-error" class="text-xs text-red-400 text-center hidden">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่</p>
        <button onclick="verifyPassword()" id="btn-login" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold text-sm rounded-xl transition">
          เข้าสู่ระบบ
        </button>
      </div>
    </div>
  </div>

  <!-- Main Workspace -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Sidebar: Playlists -->
    <aside class="w-64 bg-zinc-900/50 border-r border-zinc-800/80 flex flex-col">
      <div class="p-5 flex items-center justify-between border-b border-zinc-800/80">
        <div class="flex items-center gap-2.5">
          <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
          <span class="font-semibold tracking-tight text-sm uppercase text-zinc-300">MinimalTube</span>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="createPlaylist()" title="สร้าง Playlist ใหม่" class="p-1.5 hover:bg-zinc-800 rounded-lg text-zinc-400 hover:text-white transition">
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>
          <button onclick="logout()" title="ล็อกหน้าจอ" class="p-1.5 hover:bg-zinc-800 rounded-lg text-zinc-500 hover:text-red-400 transition">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div id="playlist-list" class="flex-1 overflow-y-auto p-3 space-y-1"></div>
    </aside>

    <!-- Center & Right Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
      
      <!-- Top Search Bar + ปุ่มไมค์ค้นหาด้วยเสียง -->
      <header class="p-4 border-b border-zinc-800/80 flex items-center justify-between gap-3 bg-zinc-950/80 backdrop-blur">
        <div class="flex items-center gap-2.5 flex-1 max-w-2xl">
          <div class="relative flex-1 flex items-center">
            <i data-lucide="search" class="w-4 h-4 absolute left-3.5 text-zinc-500 pointer-events-none"></i>
            <input id="search-input" type="text" placeholder="ค้นหาเพลง หรือกดไมค์เพื่อพูดชื่อเพลง..." 
              onkeydown="if(event.key==='Enter') searchYouTube()"
              class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-10 pr-10 py-2 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-zinc-600 transition">
            
            <!-- ปุ่มไมโครโฟน (Voice Search) -->
            <button id="btn-mic" onclick="startVoiceSearch()" title="ค้นหาด้วยเสียงพูด" 
              class="absolute right-2 p-1.5 rounded-lg text-zinc-400 hover:text-emerald-400 hover:bg-zinc-800 transition">
              <i data-lucide="mic" class="w-4 h-4"></i>
            </button>
          </div>
          <button onclick="searchYouTube()" class="px-4 py-2 bg-zinc-100 text-zinc-900 font-medium text-sm rounded-xl hover:bg-white transition shrink-0">
            ค้นหา
          </button>
        </div>

        <!-- AdBlock Status Badge -->
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs shrink-0">
          <i data-lucide="shield-check" class="w-4 h-4"></i>
          <span id="adblock-status">AdShield: พร้อมทำงาน</span>
        </div>
      </header>

      <!-- Content Split: Player/Search (Left) & Active Queue (Right) -->
      <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Area: Video Player + Search Results -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
          
          <!-- Video Container (Fullscreen Target) -->
          <div id="player-container" class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-zinc-800/80 shadow-2xl group">
            <!-- Engine 1: HTML5 Native Video (ไร้โฆษณา 100%) -->
            <video id="native-player" class="w-full h-full hidden object-contain bg-black" playsinline></video>
            
            <!-- Engine 2: YouTube IFrame + Auto Ad-Skipper -->
            <div id="yt-player-wrap" class="w-full h-full">
              <div id="yt-player" class="w-full h-full pointer-events-none"></div>
            </div>

            <!-- แผ่นใสรับการคลิกเล่น/หยุด และป้องกันโฆษณาเด้ง -->
            <div onclick="togglePlay()" class="absolute inset-0 cursor-pointer"></div>
          </div>

          <!-- Search Results Section -->
          <div id="search-section" class="hidden space-y-3">
            <div class="flex items-center justify-between">
              <h3 id="search-count-title" class="text-xs font-semibold uppercase tracking-wider text-zinc-400">ผลการค้นหา</h3>
              <button onclick="document.getElementById('search-section').classList.add('hidden')" class="text-xs text-zinc-500 hover:text-zinc-300">ซ่อนผลการค้นหา</button>
            </div>
            <div id="search-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
          </div>

        </div>

        <!-- Right Area: Current Playlist Videos (รองรับการลากสลับลำดับ) -->
        <div class="w-80 border-l border-zinc-800/80 bg-zinc-900/20 flex flex-col">
          <div class="p-4 border-b border-zinc-800/80 flex items-center justify-between">
            <div>
              <h2 id="current-playlist-title" class="font-medium text-sm text-zinc-200 truncate">เลือก Playlist</h2>
              <p id="current-playlist-count" class="text-xs text-zinc-500">ลากที่ไอคอน ⋮⋮ เพื่อจัดลำดับเพลง</p>
            </div>
          </div>
          <div id="queue-list" class="flex-1 overflow-y-auto p-3 space-y-1.5"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bottom Control Bar -->
  <footer class="h-24 bg-zinc-900/95 border-t border-zinc-800 px-6 flex items-center justify-between gap-4 backdrop-blur">
    
    <!-- 1. Now Playing Info -->
    <div class="w-1/4 flex items-center gap-3 overflow-hidden">
      <div class="w-11 h-11 rounded-xl bg-zinc-800 flex items-center justify-center shrink-0">
        <i data-lucide="music" class="w-5 h-5 text-zinc-400"></i>
      </div>
      <div class="truncate">
        <div id="now-playing-title" class="text-sm font-medium text-zinc-200 truncate">ยังไม่ได้เลือกวิดีโอ</div>
        <div id="now-playing-status" class="text-xs text-zinc-500">พร้อมใช้งาน</div>
      </div>
    </div>

    <!-- 2. Center Controls: Buttons + Progress Bar -->
    <div class="flex-1 max-w-xl flex flex-col items-center gap-2">
      <div class="flex items-center gap-5">
        <!-- ปุ่มสุ่มเพลง (Shuffle) -->
        <button id="btn-shuffle" onclick="toggleShuffle()" title="สุ่มเพลง (Shuffle)" class="p-1.5 rounded-lg text-zinc-400 hover:text-white transition">
          <i data-lucide="shuffle" class="w-4 h-4"></i>
        </button>
        <button onclick="prevVideo()" title="ก่อนหน้า" class="p-1.5 rounded-lg text-zinc-300 hover:text-white transition">
          <i data-lucide="skip-back" class="w-5 h-5"></i>
        </button>
        <button onclick="togglePlay()" id="btn-play" title="เล่น/หยุด" class="w-10 h-10 rounded-full bg-white text-zinc-950 flex items-center justify-center hover:scale-105 transition shadow">
          <i data-lucide="play" class="w-5 h-5 fill-current"></i>
        </button>
        <button onclick="nextVideo()" title="ถัดไป (ข้าม)" class="p-1.5 rounded-lg text-zinc-300 hover:text-white transition">
          <i data-lucide="skip-forward" class="w-5 h-5"></i>
        </button>
        <!-- ปุ่มเล่นซ้ำเพลงเดิม (Repeat One) -->
        <button id="btn-repeat" onclick="toggleRepeat()" title="เล่นซ้ำเพลงเดิม (Repeat)" class="p-1.5 rounded-lg text-zinc-400 hover:text-white transition">
          <i data-lucide="repeat" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="w-full flex items-center gap-3">
        <span id="current-time" class="text-[11px] font-mono text-zinc-400 w-10 text-right">0:00</span>
        <input id="progress-bar" type="range" min="0" max="100" value="0" step="0.1"
          oninput="onSeekInput(this.value)" onchange="onSeekChange(this.value)"
          class="flex-1">
        <span id="total-duration" class="text-[11px] font-mono text-zinc-400 w-10">0:00</span>
      </div>
    </div>

    <!-- 3. Right Controls: Speed, Volume, Fullscreen -->
    <div class="w-1/4 flex justify-end items-center gap-4">
      <div class="flex items-center bg-zinc-800/80 rounded-lg px-2 py-1 border border-zinc-700/50" title="ความเร็วการเล่น">
        <i data-lucide="gauge" class="w-3.5 h-3.5 text-zinc-400 mr-1.5"></i>
        <select id="speed-select" onchange="changeSpeed(this.value)" class="bg-transparent text-xs font-medium text-zinc-200 focus:outline-none cursor-pointer">
          <option value="0.5" class="bg-zinc-900">0.5x</option>
          <option value="0.75" class="bg-zinc-900">0.75x</option>
          <option value="1" selected class="bg-zinc-900">1x</option>
          <option value="1.25" class="bg-zinc-900">1.25x</option>
          <option value="1.5" class="bg-zinc-900">1.5x</option>
          <option value="2" class="bg-zinc-900">2x</option>
        </select>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleMute()" id="btn-mute" title="เปิด/ปิดเสียง" class="text-zinc-400 hover:text-white transition">
          <i data-lucide="volume-2" class="w-4 h-4"></i>
        </button>
        <input id="volume-bar" type="range" min="0" max="100" value="100" 
          oninput="changeVolume(this.value)"
          class="w-20" title="ระดับเสียง">
      </div>

      <button onclick="toggleFullscreen()" title="แสดงผลเต็มจอ" class="p-2 rounded-xl bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 hover:text-white transition">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
    </div>

  </footer>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // ==========================================
    // ตั้งค่าเฉพาะ URL ของ RENDER ที่นี่ (GAS_URL ถูกซ่อนไว้ใน Render แล้ว)
    // ==========================================
    const RENDER_API_URL = 'https://mytube-backend-0ht8.onrender.com'; // เช่น https://mytube-backend.onrender.com

    let appPassword = localStorage.getItem('mytube_pass') || '';
    let playlists = [];
    let activePlaylistId = null;
    let currentIndex = -1;
    let isShuffle = false;
    let isRepeat = false;
    let isPlaying = false;
    let isSeeking = false;
    let currentSpeed = 1;
    let currentVolume = 100;
    let isMuted = false;
    let activeEngine = 'yt';
    let expectedDuration = 0;
    let progressTimer = null;
    let sortableQueue = null;
    let player;
    const nativeVideo = document.getElementById('native-player');

    lucide.createIcons();

    // 1. ระบบตรวจสอบรหัสผ่าน (Password Gate)
    async function verifyPassword(savedPass) {
      const pass = savedPass || document.getElementById('password-input').value.trim();
      if (!pass) return;

      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('login-error');
      btn.innerText = 'กำลังตรวจสอบ...';
      errEl.classList.add('hidden');

      try {
        const res = await fetch(`${RENDER_API_URL}/api/auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });

        if (res.ok) {
          appPassword = pass;
          localStorage.setItem('mytube_pass', pass);
          document.getElementById('login-modal').classList.add('hidden');
          loadPlaylists();
        } else {
          localStorage.removeItem('mytube_pass');
          errEl.classList.remove('hidden');
        }
      } catch (e) {
        errEl.innerText = 'กำลังปลุกเซิร์ฟเวอร์ Render กรุณารอ 10 วินาทีแล้วกดอีกครั้ง';
        errEl.classList.remove('hidden');
      }
      btn.innerText = 'เข้าสู่ระบบ';
    }

    function logout() {
      localStorage.removeItem('mytube_pass');
      appPassword = '';
      if (player && player.stopVideo) player.stopVideo();
      nativeVideo.pause();
      document.getElementById('password-input').value = '';
      document.getElementById('login-modal').classList.remove('hidden');
    }

    // ฟังก์ชันช่วยส่ง Header รหัสผ่านทุกครั้งที่เรียก API
    function authHeaders(isJSON = false) {
      const headers = { 'x-app-password': appPassword };
      if (isJSON) headers['Content-Type'] = 'application/json';
      return headers;
    }

    // 2. ระบบค้นหาด้วยเสียงพูด (Microphone Voice Search)
    function startVoiceSearch() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        return alert('เบราว์เซอร์ของคุณไม่รองรับการสั่งงานด้วยเสียง (แนะนำให้ใช้ Chrome หรือ Edge)');
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'th-TH';
      recognition.interimResults = false;

      const micBtn = document.getElementById('btn-mic');
      micBtn.className = 'absolute right-2 p-1.5 rounded-lg text-red-400 bg-red-500/20 animate-pulse transition';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('search-input').value = transcript;
        searchYouTube();
      };

      recognition.onend = () => {
        micBtn.className = 'absolute right-2 p-1.5 rounded-lg text-zinc-400 hover:text-emerald-400 hover:bg-zinc-800 transition';
      };

      recognition.onerror = () => {
        micBtn.className = 'absolute right-2 p-1.5 rounded-lg text-zinc-400 hover:text-emerald-400 hover:bg-zinc-800 transition';
      };

      recognition.start();
    }

    // 3. ตั้งค่าตัวเล่น Native Video & YouTube IFrame
    nativeVideo.addEventListener('play', () => {
      if (activeEngine !== 'native') return;
      isPlaying = true;
      nativeVideo.playbackRate = currentSpeed;
      updatePlayButton();
      startProgressTimer();
      document.getElementById('now-playing-status').innerText = 'กำลังเล่น (Direct MP4 ไร้โฆษณา 100%)';
    });
    nativeVideo.addEventListener('pause', () => {
      if (activeEngine !== 'native') return;
      isPlaying = false;
      updatePlayButton();
      document.getElementById('now-playing-status').innerText = 'หยุดชั่วคราว';
    });
    nativeVideo.addEventListener('ended', () => {
      if (activeEngine !== 'native') return;
      handleVideoEnded();
    });
    nativeVideo.addEventListener('error', () => {
      if (activeEngine === 'native') fallbackToYouTubeIframe();
    });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          autoplay: 1,
          controls: 0,
          rel: 0,
          modestbranding: 1,
          iv_load_policy: 3,
          disablekb: 1,
          origin: window.location.origin
        },
        events: {
          onReady: () => {
            player.setVolume(100);
            if (appPassword) verifyPassword(appPassword);
          },
          onStateChange: onPlayerStateChange,
          onError: () => nextVideo()
        }
      });
    }

    function onPlayerStateChange(event) {
      if (activeEngine !== 'yt') return;
      if (event.data === YT.PlayerState.ENDED) {
        stopProgressTimer();
        handleVideoEnded();
      } else if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        player.setPlaybackRate(currentSpeed);
        updatePlayButton();
        startProgressTimer();
        document.getElementById('now-playing-status').innerText = 'กำลังเล่น';
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        stopProgressTimer();
        updatePlayButton();
        document.getElementById('now-playing-status').innerText = 'หยุดชั่วคราว';
      }
    }

    function handleVideoEnded() {
      if (isRepeat) {
        // เล่นซ้ำเพลงเดิม
        if (activeEngine === 'native') {
          nativeVideo.currentTime = 0;
          nativeVideo.play();
        } else if (player) {
          player.seekTo(1, true);
          player.playVideo();
        }
      } else {
        nextVideo();
      }
    }

    // 4. ระบบจัดการแถบเวลา + ระบบฆ่าโฆษณาใน IFrame
    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      sec = Math.floor(sec);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function startProgressTimer() {
      stopProgressTimer();
      progressTimer = setInterval(() => {
        if (!isPlaying || isSeeking) return;

        let current = 0;
        let duration = 0;

        if (activeEngine === 'native') {
          current = nativeVideo.currentTime || 0;
          duration = nativeVideo.duration || 0;
        } else if (player && player.getCurrentTime) {
          current = player.getCurrentTime() || 0;
          duration = player.getDuration() || 0;

          // หากตรวจพบโฆษณาแทรก (ความยาวคลิปไม่ตรงกับเพลงจริง หรือยาวไม่เกิน 90 วินาทีในขณะที่เพลงจริงยาวกว่ามาก)
          if (expectedDuration > 100 && duration > 0 && duration <= 90 && Math.abs(duration - expectedDuration) > 50) {
            document.getElementById('adblock-status').innerText = 'AdShield: กำลังตัดโฆษณา...';
            player.mute();
            player.setPlaybackRate(2);
            player.seekTo(duration, true);
            // หากโฆษณาไม่ยอมให้ seek ให้สั่งโหลดข้ามวินาทีที่ 1 ใหม่ทันที
            const pl = playlists.find(p => p.id === activePlaylistId);
            if (pl && pl.videos[currentIndex] && current < 2) {
              player.loadVideoById({ videoId: pl.videos[currentIndex].videoId, startSeconds: 1 });
            }
            return;
          } else {
            if (!isMuted && player.isMuted()) player.unMute();
            if (player.getPlaybackRate() !== currentSpeed) player.setPlaybackRate(currentSpeed);
            document.getElementById('adblock-status').innerText = 'AdShield: ป้องกันโฆษณาทำงาน';
          }
        }

        if (duration > 0) {
          document.getElementById('progress-bar').value = (current / duration) * 100;
          document.getElementById('current-time').innerText = formatTime(current);
          document.getElementById('total-duration').innerText = formatTime(duration);
        }
      }, 350);
    }

    function stopProgressTimer() {
      if (progressTimer) clearInterval(progressTimer);
    }

    function onSeekInput(percent) {
      isSeeking = true;
      const duration = activeEngine === 'native' ? (nativeVideo.duration || 0) : (player ? player.getDuration() || 0 : 0);
      const targetTime = (percent / 100) * duration;
      document.getElementById('current-time').innerText = formatTime(targetTime);
    }

    function onSeekChange(percent) {
      const duration = activeEngine === 'native' ? (nativeVideo.duration || 0) : (player ? player.getDuration() || 0 : 0);
      const targetTime = (percent / 100) * duration;
      if (activeEngine === 'native') {
        nativeVideo.currentTime = targetTime;
      } else if (player) {
        player.seekTo(targetTime, true);
      }
      isSeeking = false;
    }

    // 5. ระบบเสียง ความเร็ว ปุ่มสุ่ม และปุ่มเล่นซ้ำ
    function changeVolume(val) {
      currentVolume = Number(val);
      isMuted = currentVolume === 0;
      nativeVideo.volume = currentVolume / 100;
      nativeVideo.muted = isMuted;
      if (player && player.setVolume) {
        player.setVolume(currentVolume);
        if (currentVolume > 0 && player.isMuted()) player.unMute();
      }
      updateVolumeIcon(currentVolume, isMuted);
    }

    function toggleMute() {
      isMuted = !isMuted;
      nativeVideo.muted = isMuted;
      if (player) {
        if (isMuted) player.mute();
        else player.unMute();
      }
      document.getElementById('volume-bar').value = isMuted ? 0 : currentVolume;
      updateVolumeIcon(isMuted ? 0 : currentVolume, isMuted);
    }

    function updateVolumeIcon(vol, muted) {
      const btn = document.getElementById('btn-mute');
      let iconName = 'volume-2';
      if (muted || vol === 0) iconName = 'volume-x';
      else if (vol < 50) iconName = 'volume-1';
      btn.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4"></i>`;
      lucide.createIcons();
    }

    function changeSpeed(rate) {
      currentSpeed = parseFloat(rate);
      nativeVideo.playbackRate = currentSpeed;
      if (player && player.setPlaybackRate) {
        player.setPlaybackRate(currentSpeed);
      }
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      const btn = document.getElementById('btn-shuffle');
      btn.className = isShuffle 
        ? 'p-1.5 rounded-lg text-emerald-400 bg-emerald-500/15 transition' 
        : 'p-1.5 rounded-lg text-zinc-400 hover:text-white transition';
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      const btn = document.getElementById('btn-repeat');
      btn.className = isRepeat 
        ? 'p-1.5 rounded-lg text-emerald-400 bg-emerald-500/15 transition' 
        : 'p-1.5 rounded-lg text-zinc-400 hover:text-white transition';
    }

    // 6. ระบบจัดการฐานข้อมูลผ่าน Proxy ของ Render (ซ่อน GAS_URL 100%)
    async function loadPlaylists() {
      try {
        const res = await fetch(`${RENDER_API_URL}/api/playlists`, {
          headers: authHeaders()
        });
        const json = await res.json();
        playlists = json.data || [];
        if (playlists.length > 0 && !activePlaylistId) {
          activePlaylistId = playlists[0].id;
        }
        renderPlaylists();
        renderQueue();
      } catch (e) {
        console.error('Error loading playlists:', e);
      }
    }

    async function postGAS(payload) {
      await fetch(`${RENDER_API_URL}/api/playlists`, {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify(payload)
      });
    }

    async function createPlaylist() {
      const name = prompt('ตั้งชื่อ Playlist ใหม่:');
      if (!name) return;
      await postGAS({ action: 'create', name });
      await loadPlaylists();
    }

    async function renamePlaylist(id, oldName, event) {
      event.stopPropagation();
      const name = prompt('แก้ไขชื่อ Playlist:', oldName);
      if (!name || name === oldName) return;
      await postGAS({ action: 'rename', id, name });
      await loadPlaylists();
    }

    async function deletePlaylist(id, event) {
      event.stopPropagation();
      if (!confirm('ยืนยันการลบ Playlist นี้?')) return;
      await postGAS({ action: 'delete', id });
      if (activePlaylistId === id) activePlaylistId = null;
      await loadPlaylists();
    }

    async function addVideoToPlaylist(video) {
      if (!activePlaylistId) return alert('กรุณาสร้างและเลือก Playlist ด้านซ้ายมือก่อนครับ');
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl) return;

      pl.videos.push(video);
      renderQueue();
      await postGAS({ action: 'update_videos', id: pl.id, videos: pl.videos });
    }

    async function removeVideoFromPlaylist(index, event) {
      event.stopPropagation();
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl) return;

      pl.videos.splice(index, 1);
      if (currentIndex === index) currentIndex = -1;
      else if (currentIndex > index) currentIndex--;
      renderQueue();
      await postGAS({ action: 'update_videos', id: pl.id, videos: pl.videos });
    }

    // 7. ระบบค้นหา
    async function searchYouTube() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;

      const resultsDiv = document.getElementById('search-results');
      const countTitle = document.getElementById('search-count-title');
      document.getElementById('search-section').classList.remove('hidden');
      countTitle.innerText = 'กำลังค้นหา...';
      resultsDiv.innerHTML = '';

      try {
        const res = await fetch(`${RENDER_API_URL}/api/search?q=${encodeURIComponent(q)}`, {
          headers: authHeaders()
        });
        const data = await res.json();
        const list = data.results || [];
        
        countTitle.innerText = `ผลการค้นหาทั้งหมด (${list.length} รายการ)`;
        resultsDiv.innerHTML = list.map(v => `
          <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-xl p-2.5 flex gap-3 items-center hover:border-zinc-700 transition">
            <img src="${v.thumbnail}" class="w-20 h-12 object-cover rounded-lg shrink-0">
            <div class="flex-1 min-w-0">
              <div class="text-xs font-medium text-zinc-200 truncate" title="${v.title.replace(/"/g, '&quot;')}">${v.title}</div>
              <div class="text-[11px] text-zinc-500 truncate">${v.author} • ${v.duration}</div>
            </div>
            <button onclick='addVideoToPlaylist(${JSON.stringify(v).replace(/'/g, "&#39;")})' 
              title="เพิ่มเข้า Playlist ปัจจุบัน"
              class="p-2 bg-zinc-800 hover:bg-emerald-500 hover:text-zinc-950 rounded-lg text-zinc-300 transition shrink-0">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>
        `).join('');
        lucide.createIcons();
      } catch (e) {
        countTitle.innerText = 'เกิดข้อผิดพลาดในการค้นหา';
      }
    }

    // 8. ระบบเล่นวิดีโอแบบ Triple-Shield AdBlock
    async function playVideoAt(index) {
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl || !pl.videos[index]) return;

      currentIndex = index;
      const video = pl.videos[index];
      expectedDuration = video.seconds || 0;

      document.getElementById('progress-bar').value = 0;
      document.getElementById('current-time').innerText = '0:00';
      document.getElementById('now-playing-title').innerText = video.title;
      document.getElementById('now-playing-status').innerText = 'กำลังสกัดสตรีมไร้โฆษณา...';
      renderQueue();

      if (player && player.stopVideo) player.stopVideo();
      nativeVideo.pause();

      try {
        const res = await fetch(`${RENDER_API_URL}/api/stream?id=${video.videoId}`, {
          headers: authHeaders()
        });
        if (res.ok) {
          const data = await res.json();
          if (data.url) {
            activeEngine = 'native';
            document.getElementById('yt-player-wrap').classList.add('hidden');
            nativeVideo.classList.remove('hidden');
            document.getElementById('adblock-status').innerText = 'Direct MP4 (ไร้โฆษณา 100%)';
            nativeVideo.src = data.url;
            nativeVideo.play();
            return;
          }
        }
      } catch (e) {}

      fallbackToYouTubeIframe();
    }

    function fallbackToYouTubeIframe() {
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl || !pl.videos[currentIndex]) return;
      const video = pl.videos[currentIndex];

      activeEngine = 'yt';
      nativeVideo.classList.add('hidden');
      document.getElementById('yt-player-wrap').classList.remove('hidden');
      document.getElementById('adblock-status').innerText = 'AdShield: โหมดข้ามโฆษณาอัตโนมัติ';

      if (player && player.loadVideoById) {
        // เริ่มเล่นที่วินาทีที่ 1 เพื่อกระโดดข้าม Trigger โฆษณาต้นคลิปที่วินาที 0
        player.loadVideoById({
          videoId: video.videoId,
          startSeconds: 1,
          suggestedQuality: 'large'
        });
      }
    }

    function togglePlay() {
      if (currentIndex === -1) return;
      if (activeEngine === 'native') {
        if (nativeVideo.paused) nativeVideo.play();
        else nativeVideo.pause();
      } else if (player) {
        if (isPlaying) player.pauseVideo();
        else player.playVideo();
      }
    }

    function updatePlayButton() {
      const btn = document.getElementById('btn-play');
      btn.innerHTML = `<i data-lucide="${isPlaying ? 'pause' : 'play'}" class="w-5 h-5 fill-current"></i>`;
      lucide.createIcons();
    }

    function nextVideo() {
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl || pl.videos.length === 0) return;

      if (isShuffle) {
        currentIndex = Math.floor(Math.random() * pl.videos.length);
      } else {
        currentIndex = (currentIndex + 1) % pl.videos.length;
      }
      playVideoAt(currentIndex);
    }

    function prevVideo() {
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl || pl.videos.length === 0) return;

      currentIndex = (currentIndex - 1 + pl.videos.length) % pl.videos.length;
      playVideoAt(currentIndex);
    }

    function toggleFullscreen() {
      const elem = document.getElementById('player-container');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => console.error(err));
      } else {
        document.exitFullscreen();
      }
    }

    // 9. การวาดหน้าจอ + ระบบลากสลับลำดับเพลง (Drag & Drop)
    function selectPlaylist(id) {
      activePlaylistId = id;
      currentIndex = -1;
      renderPlaylists();
      renderQueue();
    }

    function renderPlaylists() {
      const container = document.getElementById('playlist-list');
      container.innerHTML = playlists.map(p => {
        const active = p.id === activePlaylistId;
        return `
          <div onclick="selectPlaylist('${p.id}')" 
            class="group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer transition ${active ? 'bg-zinc-800 text-white' : 'text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200'}">
            <div class="flex items-center gap-2.5 truncate">
              <i data-lucide="list-music" class="w-4 h-4 shrink-0 ${active ? 'text-emerald-400' : 'text-zinc-500'}"></i>
              <span class="text-sm truncate">${p.name}</span>
            </div>
            <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
              <button onclick="renamePlaylist('${p.id}', '${p.name}', event)" class="p-1 hover:text-white"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
              <button onclick="deletePlaylist('${p.id}', event)" class="p-1 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function renderQueue() {
      const pl = playlists.find(p => p.id === activePlaylistId);
      const titleEl = document.getElementById('current-playlist-title');
      const countEl = document.getElementById('current-playlist-count');
      const queueEl = document.getElementById('queue-list');

      if (!pl) {
        titleEl.innerText = 'ยังไม่ได้เลือก Playlist';
        countEl.innerText = '0 รายการ';
        queueEl.innerHTML = '';
        return;
      }

      titleEl.innerText = pl.name;
      countEl.innerText = `${pl.videos.length} รายการ • ลาก ⋮⋮ เพื่อสลับลำดับ`;

      queueEl.innerHTML = pl.videos.map((v, idx) => {
        const playing = idx === currentIndex;
        return `
          <div onclick="playVideoAt(${idx})" data-index="${idx}"
            class="group flex items-center gap-2 p-2 rounded-xl cursor-pointer transition ${playing ? 'bg-emerald-500/10 border border-emerald-500/30' : 'hover:bg-zinc-800/60'}">
            <!-- ปุ่มจับสำหรับลากสลับลำดับ (Drag Handle) -->
            <div onclick="event.stopPropagation()" class="drag-handle cursor-grab active:cursor-grabbing p-1 text-zinc-600 hover:text-zinc-300">
              <i data-lucide="grip-vertical" class="w-3.5 h-3.5"></i>
            </div>
            <img src="${v.thumbnail}" class="w-12 h-8 object-cover rounded shrink-0">
            <div class="flex-1 min-w-0">
              <div class="text-xs font-medium truncate ${playing ? 'text-emerald-400' : 'text-zinc-200'}">${v.title}</div>
              <div class="text-[10px] text-zinc-500 truncate">${v.author}</div>
            </div>
            <button onclick="removeVideoFromPlaylist(${idx}, event)" class="opacity-0 group-hover:opacity-100 p-1 text-zinc-500 hover:text-red-400 transition">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
      }).join('');
      lucide.createIcons();

      // เปิดใช้งานการลากสลับลำดับ (Drag & Drop) พร้อมบันทึกลง Google Sheets อัตโนมัติ
      if (sortableQueue) sortableQueue.destroy();
      sortableQueue = new Sortable(queueEl, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'sortable-ghost',
        onEnd: async (evt) => {
          const oldIdx = evt.oldIndex;
          const newIdx = evt.newIndex;
          if (oldIdx === newIdx) return;

          // สลับตำแหน่งใน Array
          const movedItem = pl.videos.splice(oldIdx, 1)[0];
          pl.videos.splice(newIdx, 0, movedItem);

          // อัปเดตตำแหน่งเพลงที่กำลังเล่นอยู่ให้ตรงตามลำดับใหม่
          if (currentIndex === oldIdx) {
            currentIndex = newIdx;
          } else if (currentIndex > oldIdx && currentIndex <= newIdx) {
            currentIndex--;
          } else if (currentIndex < oldIdx && currentIndex >= newIdx) {
            currentIndex++;
          }

          renderQueue();
          await postGAS({ action: 'update_videos', id: pl.id, videos: pl.videos });
        }
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MinimalTube Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap');
    body { font-family: 'Inter', 'Noto Sans Thai', sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #27272a;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: #10b981;
      margin-top: -4px;
      transition: transform 0.15s ease;
    }
    input[type="range"]:hover::-webkit-slider-thumb {
      transform: scale(1.25);
      background: #34d399;
    }
    .sortable-ghost {
      opacity: 0.3;
      background: #10b98120 !important;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-[100dvh] flex flex-col overflow-hidden select-none">

  <!-- หน้าจอล็อกรหัสผ่านก่อนเข้าใช้งาน (Password Gate) -->
  <div id="login-modal" class="fixed inset-0 z-50 bg-zinc-950 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl space-y-5">
      <div class="flex flex-col items-center text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h1 class="text-lg font-semibold text-zinc-100">MinimalTube Private</h1>
        <p class="text-xs text-zinc-400">กรุณาใส่รหัสผ่านเพื่อเข้าใช้งานระบบ</p>
      </div>
      <div class="space-y-3">
        <input id="password-input" type="password" placeholder="รหัสผ่าน..." 
          onkeydown="if(event.key==='Enter') verifyPassword()"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-center tracking-widest text-zinc-100 focus:outline-none focus:border-emerald-500 transition">
        <p id="login-error" class="text-xs text-red-400 text-center hidden">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่</p>
        <button onclick="verifyPassword()" id="btn-login" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold text-sm rounded-xl transition">
          เข้าสู่ระบบ
        </button>
      </div>
    </div>
  </div>

  <!-- Top Header (แสดงทั้งคอมและมือถือ) -->
  <header class="px-3 py-2.5 md:px-5 md:py-3.5 border-b border-zinc-800/80 flex items-center justify-between gap-2 bg-zinc-950/90 backdrop-blur shrink-0 z-20">
    <!-- โลโก้ (บนมือถือจะย่อขนาดลง) -->
    <div class="flex items-center gap-2 shrink-0">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
      <span class="font-semibold tracking-tight text-xs md:text-sm uppercase text-zinc-200 hidden sm:inline">MinimalTube</span>
    </div>

    <!-- ช่องค้นหา + ปุ่มไมค์ -->
    <div class="flex items-center gap-1.5 md:gap-2 flex-1 max-w-xl">
      <div class="relative flex-1 flex items-center">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 text-zinc-500 pointer-events-none"></i>
        <input id="search-input" type="text" placeholder="ค้นหาเพลง หรือกดไมค์พูด..." 
          onkeydown="if(event.key==='Enter') searchYouTube()"
          class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-9 pr-9 py-1.5 md:py-2 text-xs md:text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-zinc-600 transition">
        <button id="btn-mic" onclick="startVoiceSearch()" title="ค้นหาด้วยเสียงพูด" 
          class="absolute right-1.5 p-1 rounded-lg text-zinc-400 hover:text-emerald-400 hover:bg-zinc-800 transition">
          <i data-lucide="mic" class="w-4 h-4"></i>
        </button>
      </div>
      <button onclick="searchYouTube()" class="px-3 py-1.5 md:px-4 md:py-2 bg-zinc-100 text-zinc-900 font-medium text-xs md:text-sm rounded-xl hover:bg-white transition shrink-0">
        ค้นหา
      </button>
    </div>

    <!-- ปุ่มสลับโหมด AdBlock & ปุ่มตัดโฆษณาฉุกเฉิน -->
    <div class="flex items-center gap-1.5 shrink-0">
      <button onclick="forceSkipAd()" title="กดเพื่อกระโดดข้ามโฆษณาทันที" 
        class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 text-[11px] font-medium transition">
        <i data-lucide="zap" class="w-3.5 h-3.5"></i>
        <span class="hidden md:inline">ตัดโฆษณา</span>
      </button>
      <div class="hidden lg:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[11px]">
        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
        <span id="adblock-status">Zero-Ad พร้อม</span>
      </div>
      <button onclick="logout()" title="ล็อกหน้าจอ" class="p-1.5 hover:bg-zinc-800 rounded-xl text-zinc-400 hover:text-red-400 transition">
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main Workspace (Responsive 3 Columns on Desktop / Tabbed Views on Mobile) -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- 1. Sidebar: Playlists (ซ่อนบนมือถือเมื่อไม่ได้เลือกแท็บ Playlists) -->
    <aside id="view-playlists" class="hidden md:flex w-full md:w-60 bg-zinc-900/40 md:border-r border-zinc-800/80 flex-col z-10">
      <div class="p-4 flex items-center justify-between border-b border-zinc-800/80">
        <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">รายการ Playlist</span>
        <button onclick="createPlaylist()" class="flex items-center gap-1 px-2.5 py-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 rounded-lg text-xs font-medium transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> สร้างใหม่
        </button>
      </div>
      <div id="playlist-list" class="flex-1 overflow-y-auto p-3 space-y-1"></div>
    </aside>

    <!-- 2. Center: Video Player & Search Results -->
    <main id="view-main" class="flex-1 flex flex-col overflow-y-auto p-3 md:p-6 space-y-4 md:space-y-6">
      
      <!-- Video Player Box -->
      <div id="player-wrapper" class="w-full max-w-4xl mx-auto space-y-2">
        <div id="player-container" class="relative w-full aspect-video bg-black rounded-xl md:rounded-2xl overflow-hidden border border-zinc-800/80 shadow-2xl">
          <!-- Engine 1: HTML5 Native Video (ไร้โฆษณา 100%) -->
          <video id="native-player" class="w-full h-full hidden object-contain bg-black" playsinline></video>
          
          <!-- Engine 2: Invidious Clean Embed (ไร้โฆษณา) -->
          <iframe id="invidious-player" class="w-full h-full hidden border-0" allow="autoplay; fullscreen"></iframe>

          <!-- Engine 3: YouTube IFrame + Auto Ad-Killer -->
          <div id="yt-player-wrap" class="w-full h-full">
            <div id="yt-player" class="w-full h-full pointer-events-none"></div>
          </div>

          <!-- แผ่นใสป้องกันการคลิกโฆษณา และรับคลิกเพื่อเล่น/หยุด -->
          <div onclick="togglePlay()" class="absolute inset-0 cursor-pointer"></div>
        </div>

        <!-- แถบสถานะ Engine บนมือถือ/คอม -->
        <div class="flex items-center justify-between px-1 text-[11px] text-zinc-400">
          <span id="mobile-engine-status" class="truncate">โหมดป้องกันโฆษณาอัตโนมัติ</span>
          <div class="flex items-center gap-2 shrink-0">
            <button onclick="switchCleanEngine()" class="text-emerald-400 hover:underline">สลับโหนดไร้โฆษณา</button>
            <span>•</span>
            <button onclick="forceSkipAd()" class="text-amber-400 hover:underline">⚡ ข้ามโฆษณาเดี๋ยวนี้</button>
          </div>
        </div>
      </div>

      <!-- Search Results Section -->
      <div id="search-section" class="hidden w-full max-w-4xl mx-auto space-y-3 pb-4">
        <div class="flex items-center justify-between">
          <h3 id="search-count-title" class="text-xs font-semibold uppercase tracking-wider text-zinc-400">ผลการค้นหา</h3>
          <button onclick="closeSearchSection()" class="text-xs text-zinc-500 hover:text-zinc-300">ซ่อนผลการค้นหา</button>
        </div>
        <div id="search-results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 md:gap-3"></div>
      </div>

    </main>

    <!-- 3. Right Area: Active Queue (ซ่อนบนมือถือเมื่อไม่ได้เลือกแท็บ Queue) -->
    <aside id="view-queue" class="hidden md:flex w-full md:w-80 md:border-l border-zinc-800/80 bg-zinc-900/20 flex-col z-10">
      <div class="p-4 border-b border-zinc-800/80 flex items-center justify-between">
        <div class="min-w-0">
          <h2 id="current-playlist-title" class="font-medium text-sm text-zinc-200 truncate">เลือก Playlist</h2>
          <p id="current-playlist-count" class="text-[11px] text-zinc-500">ลากที่ไอคอน ⋮⋮ เพื่อจัดลำดับเพลง</p>
        </div>
      </div>
      <div id="queue-list" class="flex-1 overflow-y-auto p-3 space-y-1.5"></div>
    </aside>

  </div>

  <!-- Bottom Player Control Bar (ปรับขนาดอัตโนมัติสำหรับมือถือและคอมพิวเตอร์) -->
  <footer class="bg-zinc-900/95 border-t border-zinc-800 px-3 py-2 md:px-6 md:py-3 flex flex-col gap-2 backdrop-blur shrink-0 z-20">
    
    <!-- แถบเลื่อนเวลา (Progress Bar) อยู่ด้านบนสุดของ Footer บนมือถือเพื่อให้กดง่าย -->
    <div class="w-full max-w-3xl mx-auto flex items-center gap-2.5">
      <span id="current-time" class="text-[10px] md:text-[11px] font-mono text-zinc-400 w-8 md:w-10 text-right">0:00</span>
      <input id="progress-bar" type="range" min="0" max="100" value="0" step="0.1"
        oninput="onSeekInput(this.value)" onchange="onSeekChange(this.value)"
        class="flex-1">
      <span id="total-duration" class="text-[10px] md:text-[11px] font-mono text-zinc-400 w-8 md:w-10">0:00</span>
    </div>

    <!-- แถวปุ่มควบคุมหลัก -->
    <div class="flex items-center justify-between gap-2">
      
      <!-- ชื่อเพลงที่กำลังเล่น -->
      <div class="w-1/3 md:w-1/4 flex items-center gap-2.5 overflow-hidden">
        <div class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-zinc-800 hidden sm:flex items-center justify-center shrink-0">
          <i data-lucide="music" class="w-4 h-4 text-zinc-400"></i>
        </div>
        <div class="truncate">
          <div id="now-playing-title" class="text-xs md:text-sm font-medium text-zinc-200 truncate">ยังไม่ได้เลือกวิดีโอ</div>
          <div id="now-playing-status" class="text-[10px] md:text-xs text-zinc-500 truncate">พร้อมใช้งาน</div>
        </div>
      </div>

      <!-- ปุ่มควบคุมการเล่น (Shuffle, Prev, Play/Pause, Next, Repeat) -->
      <div class="flex items-center gap-3 md:gap-5 shrink-0">
        <button id="btn-shuffle" onclick="toggleShuffle()" title="สุ่มเพลง" class="p-1.5 rounded-lg text-zinc-400 hover:text-white transition">
          <i data-lucide="shuffle" class="w-4 h-4"></i>
        </button>
        <button onclick="prevVideo()" title="ก่อนหน้า" class="p-1.5 rounded-lg text-zinc-300 hover:text-white transition">
          <i data-lucide="skip-back" class="w-5 h-5"></i>
        </button>
        <button onclick="togglePlay()" id="btn-play" title="เล่น/หยุด" class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-white text-zinc-950 flex items-center justify-center hover:scale-105 transition shadow">
          <i data-lucide="play" class="w-4 h-4 md:w-5 md:h-5 fill-current"></i>
        </button>
        <button onclick="nextVideo()" title="ถัดไป" class="p-1.5 rounded-lg text-zinc-300 hover:text-white transition">
          <i data-lucide="skip-forward" class="w-5 h-5"></i>
        </button>
        <button id="btn-repeat" onclick="toggleRepeat()" title="เล่นซ้ำเพลงเดิม" class="p-1.5 rounded-lg text-zinc-400 hover:text-white transition">
          <i data-lucide="repeat" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- ปรับความเร็ว, ระดับเสียง และเต็มจอ -->
      <div class="w-1/3 md:w-1/4 flex justify-end items-center gap-2 md:gap-3">
        <!-- ปุ่มเลือกความเร็ว -->
        <div class="flex items-center bg-zinc-800/80 rounded-lg px-1.5 py-1 border border-zinc-700/50" title="ความเร็วการเล่น">
          <select id="speed-select" onchange="changeSpeed(this.value)" class="bg-transparent text-[11px] md:text-xs font-medium text-zinc-200 focus:outline-none cursor-pointer">
            <option value="0.5" class="bg-zinc-900">0.5x</option>
            <option value="0.75" class="bg-zinc-900">0.75x</option>
            <option value="1" selected class="bg-zinc-900">1x</option>
            <option value="1.25" class="bg-zinc-900">1.25x</option>
            <option value="1.5" class="bg-zinc-900">1.5x</option>
            <option value="2" class="bg-zinc-900">2x</option>
          </select>
        </div>

        <!-- ระดับเสียง (ซ่อนแถบยาวบนจอมือถือเล็ก แต่มีปุ่ม Mute ให้กด) -->
        <div class="flex items-center gap-1.5">
          <button onclick="toggleMute()" id="btn-mute" title="เปิด/ปิดเสียง" class="p-1 text-zinc-400 hover:text-white transition">
            <i data-lucide="volume-2" class="w-4 h-4"></i>
          </button>
          <input id="volume-bar" type="range" min="0" max="100" value="100" 
            oninput="changeVolume(this.value)"
            class="hidden sm:block w-16 md:w-20" title="ระดับเสียง">
        </div>

        <!-- ปุ่มเต็มจอ -->
        <button onclick="toggleFullscreen()" title="แสดงผลเต็มจอ" class="p-1.5 md:p-2 rounded-xl bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 hover:text-white transition">
          <i data-lucide="maximize" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </footer>

  <!-- Mobile Bottom Navigation Bar (แสดงเฉพาะบนหน้าจอมือถือ < 768px) -->
  <nav class="md:hidden h-14 bg-zinc-950 border-t border-zinc-800/90 grid grid-cols-3 shrink-0 z-30">
    <button onclick="switchMobileTab('main')" id="tab-main" class="flex flex-col items-center justify-center gap-1 text-emerald-400">
      <i data-lucide="tv" class="w-4 h-4"></i>
      <span class="text-[10px] font-medium">ตัวเล่น & ค้นหา</span>
    </button>
    <button onclick="switchMobileTab('queue')" id="tab-queue" class="flex flex-col items-center justify-center gap-1 text-zinc-400">
      <i data-lucide="list-ordered" class="w-4 h-4"></i>
      <span class="text-[10px] font-medium">คิวเพลงปัจจุบัน</span>
    </button>
    <button onclick="switchMobileTab('playlists')" id="tab-playlists" class="flex flex-col items-center justify-center gap-1 text-zinc-400">
      <i data-lucide="folder-heart" class="w-4 h-4"></i>
      <span class="text-[10px] font-medium">Playlist ทั้งหมด</span>
    </button>
  </nav>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // ==========================================
    // ใส่เฉพาะ URL ของ RENDER ที่นี่
    // ==========================================
    const RENDER_API_URL = 'https://mytube-backend-0ht8.onrender.com'; // เช่น https://mytube-backend.onrender.com

    // โหนดสาธารณะสำหรับให้เบราว์เซอร์ (IP บ้าน) ช่วยดึงไฟล์ MP4 ตรงโดยไม่ติดบล็อกเซิร์ฟเวอร์
    const CLIENT_PIPED_NODES = [
      'https://pipedapi.kavin.rocks',
      'https://pipedapi.tokhmi.xyz',
      'https://api.piped.projectsegfau.lt'
    ];
    const CLEAN_EMBED_NODES = [
      'https://inv.nadeko.net',
      'https://invidious.nerdvpn.de',
      'https://inv.tux.pizza'
    ];
    let embedNodeIdx = 0;

    let appPassword = localStorage.getItem('mytube_pass') || '';
    let playlists = [];
    let activePlaylistId = null;
    let currentIndex = -1;
    let isShuffle = false;
    let isRepeat = false;
    let isPlaying = false;
    let isSeeking = false;
    let currentSpeed = 1;
    let currentVolume = 100;
    let isMuted = false;
    let activeEngine = 'native'; // 'native' | 'invidious' | 'yt'
    let expectedDuration = 0;
    let lastKnownTime = 0;
    let progressTimer = null;
    let sortableQueue = null;
    let player;

    const nativeVideo = document.getElementById('native-player');
    const invidiousIframe = document.getElementById('invidious-player');

    lucide.createIcons();

    // 1. ระบบสลับหน้าจอบนมือถือ (Responsive Mobile Tabs)
    function switchMobileTab(tab) {
      if (window.innerWidth >= 768) return; // บนจอคอมแสดงครบทุกคอลัมน์อยู่แล้ว

      const vMain = document.getElementById('view-main');
      const vQueue = document.getElementById('view-queue');
      const vPlaylists = document.getElementById('view-playlists');

      const tMain = document.getElementById('tab-main');
      const tQueue = document.getElementById('tab-queue');
      const tPlaylists = document.getElementById('tab-playlists');

      vMain.classList.add('hidden');
      vQueue.classList.add('hidden');
      vQueue.classList.remove('flex');
      vPlaylists.classList.add('hidden');
      vPlaylists.classList.remove('flex');

      tMain.className = 'flex flex-col items-center justify-center gap-1 text-zinc-400';
      tQueue.className = 'flex flex-col items-center justify-center gap-1 text-zinc-400';
      tPlaylists.className = 'flex flex-col items-center justify-center gap-1 text-zinc-400';

      if (tab === 'main') {
        vMain.classList.remove('hidden');
        tMain.className = 'flex flex-col items-center justify-center gap-1 text-emerald-400';
      } else if (tab === 'queue') {
        vQueue.classList.remove('hidden');
        vQueue.classList.add('flex');
        tQueue.className = 'flex flex-col items-center justify-center gap-1 text-emerald-400';
      } else if (tab === 'playlists') {
        vPlaylists.classList.remove('hidden');
        vPlaylists.classList.add('flex');
        tPlaylists.className = 'flex flex-col items-center justify-center gap-1 text-emerald-400';
      }
    }

    // คืนค่า Layout อัตโนมัติเมื่อหมุนจอหรือขยายหน้าจอ
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) {
        document.getElementById('view-main').classList.remove('hidden');
        document.getElementById('view-queue').classList.remove('hidden');
        document.getElementById('view-playlists').classList.remove('hidden');
      } else {
        switchMobileTab('main');
      }
    });

    // 2. ระบบตรวจสอบรหัสผ่าน (Password Gate)
    async function verifyPassword(savedPass) {
      const pass = savedPass || document.getElementById('password-input').value.trim();
      if (!pass) return;

      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('login-error');
      btn.innerText = 'กำลังตรวจสอบ...';
      errEl.classList.add('hidden');

      try {
        const res = await fetch(`${RENDER_API_URL}/api/auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });

        if (res.ok) {
          appPassword = pass;
          localStorage.setItem('mytube_pass', pass);
          document.getElementById('login-modal').classList.add('hidden');
          loadPlaylists();
        } else {
          localStorage.removeItem('mytube_pass');
          errEl.classList.remove('hidden');
        }
      } catch (e) {
        errEl.innerText = 'กำลังปลุกเซิร์ฟเวอร์ Render กรุณารอ 10 วินาทีแล้วกดอีกครั้ง';
        errEl.classList.remove('hidden');
      }
      btn.innerText = 'เข้าสู่ระบบ';
    }

    function logout() {
      localStorage.removeItem('mytube_pass');
      appPassword = '';
      if (player && player.stopVideo) player.stopVideo();
      nativeVideo.pause();
      invidiousIframe.src = '';
      document.getElementById('password-input').value = '';
      document.getElementById('login-modal').classList.remove('hidden');
    }

    function authHeaders(isJSON = false) {
      const headers = { 'x-app-password': appPassword };
      if (isJSON) headers['Content-Type'] = 'application/json';
      return headers;
    }

    // 3. ระบบค้นหาด้วยเสียงพูด (Voice Search)
    function startVoiceSearch() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        return alert('เบราว์เซอร์ของคุณไม่รองรับการสั่งงานด้วยเสียง');
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'th-TH';
      recognition.interimResults = false;

      const micBtn = document.getElementById('btn-mic');
      micBtn.className = 'absolute right-1.5 p-1 rounded-lg text-red-400 bg-red-500/20 animate-pulse transition';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('search-input').value = transcript;
        searchYouTube();
      };
      recognition.onend = () => {
        micBtn.className = 'absolute right-1.5 p-1 rounded-lg text-zinc-400 hover:text-emerald-400 hover:bg-zinc-800 transition';
      };
      recognition.onerror = () => {
        micBtn.className = 'absolute right-1.5 p-1 rounded-lg text-zinc-400 hover:text-emerald-400 hover:bg-zinc-800 transition';
      };
      recognition.start();
    }

    // 4. ตั้งค่า Native HTML5 Video & YouTube IFrame
    nativeVideo.addEventListener('play', () => {
      if (activeEngine !== 'native') return;
      isPlaying = true;
      nativeVideo.playbackRate = currentSpeed;
      updatePlayButton();
      startProgressTimer();
      setEngineStatus('กำลังเล่นผ่าน Direct MP4 (ไร้โฆษณา 100%)');
    });
    nativeVideo.addEventListener('pause', () => {
      if (activeEngine !== 'native') return;
      isPlaying = false;
      updatePlayButton();
      document.getElementById('now-playing-status').innerText = 'หยุดชั่วคราว';
    });
    nativeVideo.addEventListener('ended', () => {
      if (activeEngine !== 'native') return;
      handleVideoEnded();
    });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          autoplay: 1,
          controls: 0,
          rel: 0,
          modestbranding: 1,
          iv_load_policy: 3,
          disablekb: 1,
          playsinline: 1,
          origin: window.location.origin
        },
        events: {
          onReady: () => {
            player.setVolume(100);
            if (appPassword) verifyPassword(appPassword);
          },
          onStateChange: onPlayerStateChange,
          onError: () => nextVideo()
        }
      });
    }

    function onPlayerStateChange(event) {
      if (activeEngine !== 'yt') return;

      // ตรวจจับรหัสวิดีโอที่เล่นจริง หากไม่ตรงกับรหัสเพลงที่เราสั่ง แปลว่าเป็นคลิปโฆษณาคั่น!
      try {
        const pl = playlists.find(p => p.id === activePlaylistId);
        const targetId = pl && pl.videos[currentIndex] ? pl.videos[currentIndex].videoId : null;
        const playingData = player.getVideoData ? player.getVideoData() : null;
        if (targetId && playingData && playingData.video_id && playingData.video_id !== targetId) {
          forceSkipAd();
          return;
        }
      } catch (e) {}

      if (event.data === YT.PlayerState.ENDED) {
        stopProgressTimer();
        handleVideoEnded();
      } else if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        player.setPlaybackRate(currentSpeed);
        updatePlayButton();
        startProgressTimer();
        document.getElementById('now-playing-status').innerText = 'กำลังเล่น';
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        stopProgressTimer();
        updatePlayButton();
        document.getElementById('now-playing-status').innerText = 'หยุดชั่วคราว';
      }
    }

    function handleVideoEnded() {
      if (isRepeat) {
        if (activeEngine === 'native') {
          nativeVideo.currentTime = 0;
          nativeVideo.play();
        } else if (activeEngine === 'yt' && player) {
          player.seekTo(1, true);
          player.playVideo();
        } else {
          playVideoAt(currentIndex);
        }
      } else {
        nextVideo();
      }
    }

    function setEngineStatus(text) {
      document.getElementById('now-playing-status').innerText = text;
      document.getElementById('mobile-engine-status').innerText = text;
      const badge = document.getElementById('adblock-status');
      if (badge) badge.innerText = text;
    }

    // 5. ระบบเล่นวิดีโอ 4-Layer Zero-Ad Architecture
    async function playVideoAt(index) {
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl || !pl.videos[index]) return;

      currentIndex = index;
      lastKnownTime = 0;
      const video = pl.videos[index];
      expectedDuration = video.seconds || 0;

      document.getElementById('progress-bar').value = 0;
      document.getElementById('current-time').innerText = '0:00';
      document.getElementById('now-playing-title').innerText = video.title;
      setEngineStatus('กำลังดึงสตรีมไร้โฆษณา...');
      renderQueue();
      switchMobileTab('main');

      if (player && player.stopVideo) player.stopVideo();
      nativeVideo.pause();
      invidiousIframe.src = '';

      // ชั้นที่ 1: เบราว์เซอร์ดึงตรงจาก Piped Nodes (ใช้ IP บ้านของผู้ใช้ ไม่โดนบล็อก Datacenter)
      for (const node of CLIENT_PIPED_NODES) {
        try {
          const r = await fetch(`${node}/streams/${video.videoId}`, { signal: AbortSignal.timeout(2500) });
          if (r.ok) {
            const data = await r.json();
            const stream = (data.videoStreams || []).find(s => !s.videoOnly && s.format === 'MPEG_4');
            if (stream && stream.url) {
              const ok = await tryPlayNative(stream.url);
              if (ok) return;
            }
          }
        } catch (e) {}
      }

      // ชั้นที่ 2: ให้ Render Backend ดึงผ่าน Cobalt / Invidious พร้อมท่อ Proxy
      try {
        const res = await fetch(`${RENDER_API_URL}/api/stream?id=${video.videoId}`, {
          headers: authHeaders()
        });
        if (res.ok) {
          const data = await res.json();
          if (data.url) {
            // ลองเล่นตรงก่อน หากติด CORS ให้วิ่งผ่านท่อ Proxy ของ Render
            let ok = await tryPlayNative(data.url);
            if (!ok) {
              const proxyUrl = `${RENDER_API_URL}/api/proxy-stream?url=${encodeURIComponent(data.url)}&pass=${encodeURIComponent(appPassword)}`;
              ok = await tryPlayNative(proxyUrl);
            }
            if (ok) return;
          }
        }
      } catch (e) {}

      // ชั้นที่ 3: ใช้ YT IFrame พร้อมตัวฆ่าโฆษณาอัตโนมัติ
      fallbackToYouTubeIframe(2);
    }

    function tryPlayNative(url) {
      return new Promise((resolve) => {
        activeEngine = 'native';
        document.getElementById('yt-player-wrap').classList.add('hidden');
        invidiousIframe.classList.add('hidden');
        nativeVideo.classList.remove('hidden');

        let resolved = false;
        const done = (result) => {
          if (resolved) return;
          resolved = true;
          nativeVideo.onloadeddata = null;
          nativeVideo.onerror = null;
          resolve(result);
        };

        const timer = setTimeout(() => done(false), 4500);
        nativeVideo.onloadeddata = () => {
          clearTimeout(timer);
          nativeVideo.play().then(() => done(true)).catch(() => done(false));
        };
        nativeVideo.onerror = () => {
          clearTimeout(timer);
          done(false);
        };

        nativeVideo.src = url;
        nativeVideo.load();
      });
    }

    function fallbackToYouTubeIframe(startSec = 2) {
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl || !pl.videos[currentIndex]) return;
      const video = pl.videos[currentIndex];

      activeEngine = 'yt';
      nativeVideo.pause();
      nativeVideo.classList.add('hidden');
      invidiousIframe.classList.add('hidden');
      document.getElementById('yt-player-wrap').classList.remove('hidden');
      setEngineStatus('AdGuard IFrame (กด ⚡ หากมีโฆษณา)');

      if (player && player.loadVideoById) {
        player.loadVideoById({
          videoId: video.videoId,
          startSeconds: startSec,
          suggestedQuality: 'large'
        });
      }
    }

    // ปุ่มสายฟ้า: ตัดโฆษณาฉุกเฉินทันทีด้วยการ Reload ข้ามวินาทีโฆษณา
    function forceSkipAd() {
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl || !pl.videos[currentIndex]) return;

      if (activeEngine === 'yt' && player) {
        setEngineStatus('⚡ กำลังตัดโฆษณา...');
        const jumpTo = lastKnownTime > 5 ? Math.floor(lastKnownTime) : 3;
        player.loadVideoById({
          videoId: pl.videos[currentIndex].videoId,
          startSeconds: jumpTo
        });
      } else {
        switchCleanEngine();
      }
    }

    // ปุ่มสลับไปใช้ Invidious Clean Embed (ไม่มีระบบโฆษณาของ YouTube)
    function switchCleanEngine() {
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl || !pl.videos[currentIndex]) return;
      const video = pl.videos[currentIndex];

      activeEngine = 'invidious';
      if (player && player.stopVideo) player.stopVideo();
      nativeVideo.pause();
      nativeVideo.classList.add('hidden');
      document.getElementById('yt-player-wrap').classList.add('hidden');
      invidiousIframe.classList.remove('hidden');

      const host = CLEAN_EMBED_NODES[embedNodeIdx % CLEAN_EMBED_NODES.length];
      embedNodeIdx++;
      invidiousIframe.src = `${host}/embed/${video.videoId}?autoplay=1&listen=0`;
      setEngineStatus(`Clean Embed (${new URL(host).hostname})`);
    }

    // 6. แถบเวลา & การตรวจจับโฆษณาอัตโนมัติ
    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      sec = Math.floor(sec);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function startProgressTimer() {
      stopProgressTimer();
      progressTimer = setInterval(() => {
        if (!isPlaying || isSeeking) return;

        let current = 0;
        let duration = 0;

        if (activeEngine === 'native') {
          current = nativeVideo.currentTime || 0;
          duration = nativeVideo.duration || 0;
        } else if (activeEngine === 'yt' && player && player.getCurrentTime) {
          current = player.getCurrentTime() || 0;
          duration = player.getDuration() || 0;

          // ตรวจจับโฆษณาและตัดอัตโนมัติ
          if (expectedDuration > 100 && duration > 0 && duration <= 90 && Math.abs(duration - expectedDuration) > 50) {
            forceSkipAd();
            return;
          }
          if (current > 3) lastKnownTime = current;
        }

        if (duration > 0) {
          document.getElementById('progress-bar').value = (current / duration) * 100;
          document.getElementById('current-time').innerText = formatTime(current);
          document.getElementById('total-duration').innerText = formatTime(duration);
        }
      }, 400);
    }

    function stopProgressTimer() {
      if (progressTimer) clearInterval(progressTimer);
    }

    function onSeekInput(percent) {
      isSeeking = true;
      const duration = activeEngine === 'native' ? (nativeVideo.duration || 0) : (player ? player.getDuration() || 0 : 0);
      const targetTime = (percent / 100) * duration;
      document.getElementById('current-time').innerText = formatTime(targetTime);
    }

    function onSeekChange(percent) {
      const duration = activeEngine === 'native' ? (nativeVideo.duration || 0) : (player ? player.getDuration() || 0 : 0);
      const targetTime = (percent / 100) * duration;
      if (activeEngine === 'native') {
        nativeVideo.currentTime = targetTime;
      } else if (activeEngine === 'yt' && player) {
        lastKnownTime = targetTime;
        player.seekTo(targetTime, true);
      }
      isSeeking = false;
    }

    // 7. ปุ่มควบคุมเสียง ความเร็ว การเล่นซ้ำ และเต็มจอ
    function togglePlay() {
      if (currentIndex === -1) return;
      if (activeEngine === 'native') {
        if (nativeVideo.paused) nativeVideo.play();
        else nativeVideo.pause();
      } else if (activeEngine === 'yt' && player) {
        if (isPlaying) player.pauseVideo();
        else player.playVideo();
      }
    }

    function updatePlayButton() {
      const btn = document.getElementById('btn-play');
      btn.innerHTML = `<i data-lucide="${isPlaying ? 'pause' : 'play'}" class="w-4 h-4 md:w-5 md:h-5 fill-current"></i>`;
      lucide.createIcons();
    }

    function nextVideo() {
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl || pl.videos.length === 0) return;

      if (isShuffle) {
        currentIndex = Math.floor(Math.random() * pl.videos.length);
      } else {
        currentIndex = (currentIndex + 1) % pl.videos.length;
      }
      playVideoAt(currentIndex);
    }

    function prevVideo() {
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl || pl.videos.length === 0) return;

      currentIndex = (currentIndex - 1 + pl.videos.length) % pl.videos.length;
      playVideoAt(currentIndex);
    }

    function changeVolume(val) {
      currentVolume = Number(val);
      isMuted = currentVolume === 0;
      nativeVideo.volume = currentVolume / 100;
      nativeVideo.muted = isMuted;
      if (player && player.setVolume) {
        player.setVolume(currentVolume);
        if (currentVolume > 0 && player.isMuted()) player.unMute();
      }
      updateVolumeIcon(currentVolume, isMuted);
    }

    function toggleMute() {
      isMuted = !isMuted;
      nativeVideo.muted = isMuted;
      if (player) {
        if (isMuted) player.mute();
        else player.unMute();
      }
      const bar = document.getElementById('volume-bar');
      if (bar) bar.value = isMuted ? 0 : currentVolume;
      updateVolumeIcon(isMuted ? 0 : currentVolume, isMuted);
    }

    function updateVolumeIcon(vol, muted) {
      const btn = document.getElementById('btn-mute');
      let iconName = 'volume-2';
      if (muted || vol === 0) iconName = 'volume-x';
      else if (vol < 50) iconName = 'volume-1';
      btn.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4"></i>`;
      lucide.createIcons();
    }

    function changeSpeed(rate) {
      currentSpeed = parseFloat(rate);
      nativeVideo.playbackRate = currentSpeed;
      if (player && player.setPlaybackRate) {
        player.setPlaybackRate(currentSpeed);
      }
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      const btn = document.getElementById('btn-shuffle');
      btn.className = isShuffle 
        ? 'p-1.5 rounded-lg text-emerald-400 bg-emerald-500/15 transition' 
        : 'p-1.5 rounded-lg text-zinc-400 hover:text-white transition';
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      const btn = document.getElementById('btn-repeat');
      btn.className = isRepeat 
        ? 'p-1.5 rounded-lg text-emerald-400 bg-emerald-500/15 transition' 
        : 'p-1.5 rounded-lg text-zinc-400 hover:text-white transition';
    }

    function toggleFullscreen() {
      const elem = document.getElementById('player-container');
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // 8. ระบบจัดการฐานข้อมูล Playlist ผ่าน Render Proxy
    async function loadPlaylists() {
      try {
        const res = await fetch(`${RENDER_API_URL}/api/playlists`, {
          headers: authHeaders()
        });
        const json = await res.json();
        playlists = json.data || [];
        if (playlists.length > 0 && !activePlaylistId) {
          activePlaylistId = playlists[0].id;
        }
        renderPlaylists();
        renderQueue();
      } catch (e) {
        console.error('Error loading playlists:', e);
      }
    }

    async function postGAS(payload) {
      await fetch(`${RENDER_API_URL}/api/playlists`, {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify(payload)
      });
    }

    async function createPlaylist() {
      const name = prompt('ตั้งชื่อ Playlist ใหม่:');
      if (!name) return;
      await postGAS({ action: 'create', name });
      await loadPlaylists();
    }

    async function renamePlaylist(id, oldName, event) {
      event.stopPropagation();
      const name = prompt('แก้ไขชื่อ Playlist:', oldName);
      if (!name || name === oldName) return;
      await postGAS({ action: 'rename', id, name });
      await loadPlaylists();
    }

    async function deletePlaylist(id, event) {
      event.stopPropagation();
      if (!confirm('ยืนยันการลบ Playlist นี้?')) return;
      await postGAS({ action: 'delete', id });
      if (activePlaylistId === id) activePlaylistId = null;
      await loadPlaylists();
    }

    async function addVideoToPlaylist(video, btnEl) {
      if (!activePlaylistId) return alert('กรุณาสร้างและเลือก Playlist ก่อนครับ');
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl) return;

      pl.videos.push(video);
      renderQueue();
      if (btnEl) {
        btnEl.innerHTML = '<i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>';
        lucide.createIcons();
      }
      await postGAS({ action: 'update_videos', id: pl.id, videos: pl.videos });
    }

    async function removeVideoFromPlaylist(index, event) {
      event.stopPropagation();
      const pl = playlists.find(p => p.id === activePlaylistId);
      if (!pl) return;

      pl.videos.splice(index, 1);
      if (currentIndex === index) currentIndex = -1;
      else if (currentIndex > index) currentIndex--;
      renderQueue();
      await postGAS({ action: 'update_videos', id: pl.id, videos: pl.videos });
    }

    // 9. ระบบค้นหา (ซ่อนกล่องวิดีโอชั่วคราวบนมือถือเพื่อให้เห็นผลการค้นหาเต็มตา)
    async function searchYouTube() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;

      switchMobileTab('main');
      const resultsDiv = document.getElementById('search-results');
      const countTitle = document.getElementById('search-count-title');
      document.getElementById('search-section').classList.remove('hidden');
      countTitle.innerText = 'กำลังค้นหา...';
      resultsDiv.innerHTML = '';

      try {
        const res = await fetch(`${RENDER_API_URL}/api/search?q=${encodeURIComponent(q)}`, {
          headers: authHeaders()
        });
        const data = await res.json();
        const list = data.results || [];
        
        countTitle.innerText = `ผลการค้นหาทั้งหมด (${list.length} รายการ)`;
        resultsDiv.innerHTML = list.map(v => `
          <div class="bg-zinc-900/70 border border-zinc-800/80 rounded-xl p-2.5 flex gap-3 items-center hover:border-zinc-700 transition">
            <img src="${v.thumbnail}" class="w-20 h-12 object-cover rounded-lg shrink-0">
            <div class="flex-1 min-w-0">
              <div class="text-xs font-medium text-zinc-200 truncate" title="${v.title.replace(/"/g, '&quot;')}">${v.title}</div>
              <div class="text-[11px] text-zinc-500 truncate">${v.author} • ${v.duration}</div>
            </div>
            <button onclick='addVideoToPlaylist(${JSON.stringify(v).replace(/'/g, "&#39;")}, this)' 
              title="เพิ่มเข้า Playlist ปัจจุบัน"
              class="p-2 bg-zinc-800 hover:bg-emerald-500 hover:text-zinc-950 rounded-lg text-zinc-300 transition shrink-0">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>
        `).join('');
        lucide.createIcons();
      } catch (e) {
        countTitle.innerText = 'เกิดข้อผิดพลาดในการค้นหา';
      }
    }

    function closeSearchSection() {
      document.getElementById('search-section').classList.add('hidden');
    }

    // 10. การวาดหน้าจอ & ลากสลับลำดับเพลง (Drag & Drop)
    function selectPlaylist(id) {
      activePlaylistId = id;
      currentIndex = -1;
      renderPlaylists();
      renderQueue();
      if (window.innerWidth < 768) switchMobileTab('queue');
    }

    function renderPlaylists() {
      const container = document.getElementById('playlist-list');
      container.innerHTML = playlists.map(p => {
        const active = p.id === activePlaylistId;
        return `
          <div onclick="selectPlaylist('${p.id}')" 
            class="group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer transition ${active ? 'bg-zinc-800 text-white' : 'text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200'}">
            <div class="flex items-center gap-2.5 truncate">
              <i data-lucide="list-music" class="w-4 h-4 shrink-0 ${active ? 'text-emerald-400' : 'text-zinc-500'}"></i>
              <span class="text-sm truncate">${p.name}</span>
            </div>
            <div class="flex items-center gap-1 md:opacity-0 group-hover:opacity-100 transition">
              <button onclick="renamePlaylist('${p.id}', '${p.name}', event)" class="p-1.5 hover:text-white"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
              <button onclick="deletePlaylist('${p.id}', event)" class="p-1.5 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function renderQueue() {
      const pl = playlists.find(p => p.id === activePlaylistId);
      const titleEl = document.getElementById('current-playlist-title');
      const countEl = document.getElementById('current-playlist-count');
      const queueEl = document.getElementById('queue-list');

      if (!pl) {
        titleEl.innerText = 'ยังไม่ได้เลือก Playlist';
        countEl.innerText = '0 รายการ';
        queueEl.innerHTML = '';
        return;
      }

      titleEl.innerText = pl.name;
      countEl.innerText = `${pl.videos.length} รายการ • ลาก ⋮⋮ เพื่อจัดลำดับ`;

      queueEl.innerHTML = pl.videos.map((v, idx) => {
        const playing = idx === currentIndex;
        return `
          <div onclick="playVideoAt(${idx})" data-index="${idx}"
            class="group flex items-center gap-2 p-2 rounded-xl cursor-pointer transition ${playing ? 'bg-emerald-500/10 border border-emerald-500/30' : 'hover:bg-zinc-800/60'}">
            <div onclick="event.stopPropagation()" class="drag-handle cursor-grab active:cursor-grabbing p-1.5 text-zinc-500 hover:text-zinc-200 touch-none">
              <i data-lucide="grip-vertical" class="w-4 h-4"></i>
            </div>
            <img src="${v.thumbnail}" class="w-12 h-8 object-cover rounded shrink-0">
            <div class="flex-1 min-w-0">
              <div class="text-xs font-medium truncate ${playing ? 'text-emerald-400' : 'text-zinc-200'}">${v.title}</div>
              <div class="text-[10px] text-zinc-500 truncate">${v.author}</div>
            </div>
            <button onclick="removeVideoFromPlaylist(${idx}, event)" class="md:opacity-0 group-hover:opacity-100 p-1.5 text-zinc-500 hover:text-red-400 transition">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      }).join('');
      lucide.createIcons();

      if (sortableQueue) sortableQueue.destroy();
      sortableQueue = new Sortable(queueEl, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'sortable-ghost',
        onEnd: async (evt) => {
          const oldIdx = evt.oldIndex;
          const newIdx = evt.newIndex;
          if (oldIdx === newIdx) return;

          const movedItem = pl.videos.splice(oldIdx, 1)[0];
          pl.videos.splice(newIdx, 0, movedItem);

          if (currentIndex === oldIdx) currentIndex = newIdx;
          else if (currentIndex > oldIdx && currentIndex <= newIdx) currentIndex--;
          else if (currentIndex < oldIdx && currentIndex >= newIdx) currentIndex++;

          renderQueue();
          await postGAS({ action: 'update_videos', id: pl.id, videos: pl.videos });
        }
      });
    }
  </script>
</body>
</html>
